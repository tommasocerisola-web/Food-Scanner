name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Food Scanner APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 17 SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Ensure Gradle 9.6
        run: |
          if ! command -v gradle >/dev/null 2>&1; then
            curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
            unzip -q /tmp/gradle.zip -d /opt
            echo "/opt/gradle-9.6.0/bin" >> "$GITHUB_PATH"
            export PATH="/opt/gradle-9.6.0/bin:$PATH"
          fi
          gradle --version

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Inspect APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -12
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" FoodScanner-0.3-beta.apk
          sha256sum FoodScanner-0.3-beta.apk | tee FoodScanner-0.3-beta.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoodScanner-0.3-beta
          path: |
            FoodScanner-0.3-beta.apk
            FoodScanner-0.3-beta.apk.sha256
          if-no-files-found: error
